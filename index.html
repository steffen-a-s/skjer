<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skjer – Hva skjer i Bergen?</title>
<style>
:root{color-scheme:light;--ink:#101b35;--muted:#68748a;--line:#e5eaf2;--blue:#315eea}
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1000px;margin:auto;padding:34px 22px 80px}.logo{font-size:30px;font-weight:850;letter-spacing:-1px}.eyebrow{color:#7a8799;text-transform:uppercase;letter-spacing:1.5px;font-size:12px;font-weight:750;margin-top:54px}
h1{font-size:clamp(36px,6vw,58px);letter-spacing:-2px;line-height:1.04;margin:12px 0 18px;max-width:850px}.sub{color:var(--muted);font-size:18px;line-height:1.6;max-width:720px}
.status{margin-top:28px;background:white;border:1px solid var(--line);border-radius:18px;padding:18px 20px}.ok{color:#087443;font-weight:750}.small{color:#78859a;font-size:14px;margin-top:7px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}.search{flex:1;min-width:220px}input,select{width:100%;padding:13px 15px;border:1px solid #dce3ee;border-radius:12px;background:white;color:var(--ink);font:inherit;outline-color:var(--blue)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 14px}.section-head h2{font-size:22px;margin:0}.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.event{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 12px rgba(16,27,53,.025)}.tag{align-self:flex-start;background:#edf2ff;color:#2849a8;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:750}.event h3{font-size:18px;line-height:1.35;margin:0;overflow-wrap:anywhere}.event a{color:var(--blue);font-weight:700;text-decoration:none;margin-top:auto}.event a:hover{text-decoration:underline}.source{font-size:13px;color:var(--muted)}.details{display:flex;flex-wrap:wrap;gap:7px;font-size:13px;color:#4f5d73}.detail{background:#f5f7fb;border-radius:8px;padding:6px 8px}.message{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--muted);line-height:1.6}.footer{margin-top:26px;color:#8490a3;font-size:12px}
@media(max-width:640px){main{padding:25px 16px 60px}.eyebrow{margin-top:42px}.grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}h1{letter-spacing:-1.5px}}
</style>
</head>
<body><main>
<div class="logo">Skjer</div>
<div class="eyebrow">Bergen · personlig arrangementsagent</div>
<h1>Hva skjer i Bergen som passer deg?</h1>
<p class="sub">En enklere måte å oppdage loppemarkeder, konserter og andre ting å gjøre i byen.</p>
<div class="status" aria-live="polite"><div class="ok" id="statusTitle">● Henter arrangementer …</div><div class="small" id="statusText">Sjekker de første kildene.</div></div>
<div class="controls">
<div class="search"><input id="search" type="search" placeholder="Søk etter arrangementer …" aria-label="Søk etter arrangementer"></div>
<div style="min-width:190px"><select id="category" aria-label="Velg kategori"><option value="all">Alle kategorier</option><option value="loppi">Loppemarkeder</option><option value="usf">USF Verftet</option></select></div>
</div>
<div class="section-head"><h2>Oppdag i Bergen</h2><div class="count" id="count">Laster …</div></div>
<div id="events" class="grid"><div class="message">Arrangementene lastes inn. Dette kan ta et lite øyeblikk.</div></div>
<div class="footer" id="updated"></div>
</main>
<script>
const eventsEl=document.getElementById('events');
const searchEl=document.getElementById('search');
const categoryEl=document.getElementById('category');
let allEvents=[];
function safeText(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const genericTitles=/^(arrangementer?|broadcast|loppemarkeder?|events?|program|forside|les mer|se alle arrangementer)$/i;
function relevanceScore(e){
 const text=(String(e.title||'')+' '+String(e.category||'')).toLocaleLowerCase('no');
 let score=0;
 if(/foredrag|samtale|psykologi|filosofi|samfunn|debatt|litteratur|forfatter/.test(text))score+=5;
 if(/konsert|live|musikk|jazz|rock|festival/.test(text))score+=4;
 if(/loppemarked|bruktmarked|byttemarked|klesbytte/.test(text))score+=3;
 if(/arrangementer?|broadcast|program|forside|kalender/.test(text))score-=10;
 return score;
}
function render(){
 const q=searchEl.value.trim().toLocaleLowerCase('no');
 const category=categoryEl.value;
 const filtered=allEvents.filter(e=>{
  const source=String(e.source||'').toLowerCase();
  const title=String(e.title||'').trim();
  const url=String(e.source_url||'');
  if(!title||genericTitles.test(title)||title.length<4||url==='#')return false;
  return (category==='all'||source===category)&&(!q||(title+' '+source+' '+String(e.category||'')).toLocaleLowerCase('no').includes(q));
 });
 const unique=[];
 const seen=new Set();
 for(const event of filtered){
  const key=(String(event.title||'').trim().toLocaleLowerCase('no')+'|'+String(event.source||''));
  if(!seen.has(key)){seen.add(key);unique.push(event);}
 }
 unique.sort((a,b)=>{
  const today=new Date();today.setHours(0,0,0,0);
  const da=a.date_iso?Date.parse(a.date_iso+'T00:00:00'):NaN;
  const db=b.date_iso?Date.parse(b.date_iso+'T00:00:00'):NaN;
  const futureA=Number.isFinite(da)&&da>=today.getTime();
  const futureB=Number.isFinite(db)&&db>=today.getTime();
  if(futureA&&futureB&&da!==db)return da-db;
  if(futureA!==futureB)return futureA?-1:1;
  return relevanceScore(b)-relevanceScore(a)||String(a.title||'').localeCompare(String(b.title||''),'no');
 });
 document.getElementById('count').textContent=unique.length+' treff';
 if(!unique.length){eventsEl.className='';eventsEl.innerHTML='<div class="message">Ingen konkrete arrangementer fant vi med dette søket. Prøv et annet ord eller velg «Alle kategorier».</div>';return;}
 eventsEl.className='grid';
 eventsEl.innerHTML=unique.map(e=>{
  const source=String(e.source||'').toLowerCase();
  const label=source==='loppi'?'Loppemarked':source==='usf'?'USF Verftet':(e.category||'Arrangement');
  let url='#';try{const parsed=new URL(e.source_url);if(parsed.protocol==='https:'||parsed.protocol==='http:')url=parsed.href;}catch{}
  const details=[];
  if(e.date)details.push('<span class="detail">📅 '+safeText(e.date)+'</span>');
  if(e.time)details.push('<span class="detail">🕒 '+safeText(e.time)+'</span>');
  if(e.venue)details.push('<span class="detail">📍 '+safeText(e.venue)+'</span>');
  if(e.address)details.push('<span class="detail">📍 '+safeText(e.address)+'</span>');
  return '<article class="event"><span class="tag">'+safeText(label)+'</span><h3>'+safeText(e.title)+'</h3>'+(details.length?'<div class="details">'+details.join('')+'</div>':'')+'<div class="source">Kilde: '+safeText(source==='loppi'?'Loppi Bergen':source==='usf'?'USF Verftet':source||'Ukjent')+'</div><a href="'+safeText(url)+'" target="_blank" rel="noopener noreferrer">Se hos arrangøren ↗</a></article>';
 }).join('');
}
searchEl.addEventListener('input',render);categoryEl.addEventListener('change',render);
async function loadEvents(){
 try{
  const response=await fetch('/.netlify/functions/collect-events',{headers:{accept:'application/json'}});
  if(!response.ok)throw new Error('Serveren svarte med '+response.status);
  const data=await response.json();
  if(!Array.isArray(data.events))throw new Error('Svaret mangler arrangementer');
  allEvents=data.events;
  document.getElementById('statusTitle').textContent=data.errors&&data.errors.length?'● Innhentingen er delvis tilgjengelig':'● Automatisk innhenting er aktivert';
  document.getElementById('statusText').textContent='Kildene er sjekket. Vi skjuler generelle overskrifter for å vise mer relevante treff.';
  document.getElementById('updated').textContent=data.updated_at?'Sist sjekket: '+new Date(data.updated_at).toLocaleString('no-NO'):'';
  render();
 }catch(error){
  document.getElementById('statusTitle').textContent='● Klarte ikke å hente arrangementer';
  document.getElementById('statusText').textContent='Prøv å laste siden på nytt om litt.';
  document.getElementById('count').textContent='Ingen data';
  eventsEl.className='';eventsEl.innerHTML='<div class="message">Arrangementene kunne ikke lastes inn akkurat nå.</div>';
 }
}
loadEvents();
</script>
</body></html>
